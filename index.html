<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casio fx-991ES PLUS App</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0b0f17">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Casio 991ES">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MathJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        * {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Changa', sans-serif;
            background-color: #0b0f17;
            color: #e6edf3;
            user-select: none;
            overflow-x: hidden;
        }

        /* LCD Screen Style */
        .lcd-display {
            font-family: 'Share Tech Mono', monospace;
            background: linear-gradient(135deg, #91a28d 0%, #768872 100%);
            color: #0f170e;
            box-shadow: inset 0px 3px 8px rgba(0,0,0,0.6);
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.2);
        }

        /* Metallic Body */
        .casio-body {
            background: linear-gradient(180deg, #1f242c 0%, #12151a 100%);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.1);
            border: 1px solid #2d333b;
        }

        /* Buttons Styling */
        .btn-casio {
            transition: all 0.05s ease;
            box-shadow: 0 3px 0 #090c10, 0 4px 5px rgba(0,0,0,0.4);
            position: relative;
            top: 0;
        }

        .btn-casio:active {
            top: 2px;
            box-shadow: 0 1px 0 #090c10, 0 2px 3px rgba(0,0,0,0.4);
        }

        .btn-oval {
            background: linear-gradient(180deg, #6e7681 0%, #30363d 100%);
            border-radius: 9999px;
            border: 1px solid #484f58;
            color: #f0f6fc;
        }

        .btn-number {
            background: linear-gradient(180deg, #343b44 0%, #21262d 100%);
            color: #ffffff;
            border: 1px solid #3c444d;
        }

        .btn-op {
            background: linear-gradient(180deg, #242a32 0%, #161b22 100%);
            color: #e6edf3;
            border: 1px solid #30363d;
        }

        .btn-action-green {
            background: linear-gradient(180deg, #2ea043 0%, #238636 100%);
            color: #ffffff;
            border: 1px solid #3fb950;
        }

        .btn-action-del {
            background: linear-gradient(180deg, #da3633 0%, #b62324 100%);
            color: #ffffff;
            border: 1px solid #f85149;
        }

        .shift-label { color: #e3b341; }
        .alpha-label { color: #f78166; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #161b22; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4">

    <!-- Header App Bar -->
    <div class="w-full max-w-4xl flex justify-between items-center mb-3 px-2">
        <span class="text-sm font-bold text-gray-400 flex items-center gap-2">
            <i class="fa-solid fa-calculator text-emerald-400"></i> الآلة الحاسبة الذكية العملاقة
        </span>
        <button onclick="installAppPrompt()" id="pwa-install-btn" class="hidden text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-1.5 px-3 rounded-lg flex items-center gap-1 shadow">
            <i class="fa-solid fa-download"></i> تثبيت كتطبيق
        </button>
    </div>

    <!-- Main Container -->
    <div class="w-full max-w-4xl grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

        <!-- Calculator Main Body -->
        <div class="lg:col-span-7 casio-body p-3 sm:p-5 rounded-3xl w-full max-w-md mx-auto">
            
            <!-- Brand & Solar Panel -->
            <div class="flex justify-between items-center mb-2 px-1">
                <div>
                    <h1 class="text-lg font-bold tracking-widest text-gray-200 leading-none">CASIO</h1>
                    <p class="text-[10px] text-gray-400 font-mono mt-0.5">fx-991ES PLUS <span class="text-[9px] text-gray-500">2nd edition</span></p>
                </div>
                <div class="text-left">
                    <span class="text-[9px] block text-amber-500 font-semibold tracking-wider">NATURAL-V.P.A.M.</span>
                    <div class="w-14 h-4 bg-gradient-to-r from-amber-900 to-amber-950 border border-amber-800/80 rounded opacity-80 flex items-center justify-center">
                        <div class="grid grid-cols-4 gap-0.5 w-full h-full p-0.5 opacity-30">
                            <div class="bg-amber-500"></div>
                            <div class="bg-amber-500"></div>
                            <div class="bg-amber-500"></div>
                            <div class="bg-amber-500"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- LCD Screen -->
            <div class="lcd-display rounded-lg p-2.5 mb-3 relative min-h-[100px] flex flex-col justify-between border-2 border-slate-700">
                <!-- Status Indicators Bar -->
                <div class="flex justify-between items-center text-[10px] font-mono font-bold tracking-tight text-slate-900 border-b border-slate-700/20 pb-0.5">
                    <div class="flex gap-2">
                        <span id="shift-indicator" class="opacity-0 transition-opacity">S</span>
                        <span id="alpha-indicator" class="opacity-0 transition-opacity">A</span>
                        <span id="angle-mode-display">DEG</span>
                        <span id="hyp-indicator" class="opacity-0 transition-opacity">HYP</span>
                    </div>
                    <div class="flex gap-2">
                        <span id="memory-indicator" class="opacity-0 transition-opacity">M</span>
                        <span>MATH</span>
                    </div>
                </div>

                <!-- Live Formula Display -->
                <div id="formula-display" class="text-left text-xs sm:text-sm font-mono overflow-x-auto whitespace-nowrap min-h-[18px] text-slate-800 opacity-90" dir="ltr"></div>

                <!-- Main Output Display -->
                <div id="main-display" class="text-left text-2xl sm:text-3xl font-bold font-mono overflow-x-auto whitespace-nowrap text-slate-950" dir="ltr">0</div>
            </div>

            <!-- Top Controls (SHIFT, ALPHA, Direction Pad, MODE, ON) -->
            <div class="grid grid-cols-5 gap-1.5 mb-3 items-center">
                <div class="text-center">
                    <span class="text-[9px] shift-label font-bold block">SHIFT</span>
                    <button onclick="toggleShift()" class="btn-casio btn-oval w-10 h-7 sm:w-11 sm:h-8 mx-auto text-xs font-bold flex items-center justify-center">S</button>
                </div>
                <div class="text-center">
                    <span class="text-[9px] alpha-label font-bold block">ALPHA</span>
                    <button onclick="toggleAlpha()" class="btn-casio btn-oval w-10 h-7 sm:w-11 sm:h-8 mx-auto text-xs font-bold flex items-center justify-center">A</button>
                </div>

                <!-- D-Pad Simulation -->
                <div class="flex justify-center">
                    <div class="w-11 h-11 sm:w-13 sm:h-13 bg-gradient-to-b from-gray-600 to-gray-800 rounded-full p-1 shadow-inner border border-gray-500 grid grid-cols-3 gap-0.5 items-center text-center">
                        <div></div>
                        <button onclick="scrollHistory(-1)" class="text-[9px] text-gray-300 hover:text-white"><i class="fa-solid fa-caret-up"></i></button>
                        <div></div>
                        <button onclick="moveCursor(-1)" class="text-[9px] text-gray-300 hover:text-white"><i class="fa-solid fa-caret-right"></i></button>
                        <div class="text-[7px] font-bold text-gray-400">REPLAY</div>
                        <button onclick="moveCursor(1)" class="text-[9px] text-gray-300 hover:text-white"><i class="fa-solid fa-caret-left"></i></button>
                        <div></div>
                        <button onclick="scrollHistory(1)" class="text-[9px] text-gray-300 hover:text-white"><i class="fa-solid fa-caret-down"></i></button>
                        <div></div>
                    </div>
                </div>

                <div class="text-center">
                    <span class="text-[9px] text-gray-400 font-bold block">MODE</span>
                    <button onclick="toggleAngleMode()" class="btn-casio btn-oval w-10 h-7 sm:w-11 sm:h-8 mx-auto text-[9px] font-bold flex items-center justify-center">SETUP</button>
                </div>
                <div class="text-center">
                    <span class="text-[9px] text-gray-400 font-bold block">ON</span>
                    <button onclick="resetCalculator()" class="btn-casio btn-oval w-10 h-7 sm:w-11 sm:h-8 mx-auto text-[9px] font-bold flex items-center justify-center text-amber-400">ON</button>
                </div>
            </div>

            <!-- Scientific Functions Grid -->
            <div class="grid grid-cols-6 gap-1 mb-2.5 text-center">
                <!-- Row 1 -->
                <div>
                    <span class="text-[7px] shift-label block">x!</span>
                    <button onclick="appendFunction('factorial')" class="btn-casio btn-op w-full h-7 rounded text-[11px]">x⁻¹</button>
                </div>
                <div>
                    <span class="text-[7px] shift-label block">nCr</span>
                    <button onclick="appendOp('C')" class="btn-casio btn-op w-full h-7 rounded text-[11px]">nPr</button>
                </div>
                <div>
                    <span class="text-[7px] shift-label block">1/x</span>
                    <button onclick="appendFunction('frac')" class="btn-casio btn-op w-full h-7 rounded text-[11px]">a b/c</button>
                </div>
                <div>
                    <span class="text-[7px] shift-label block">∛</span>
                    <button onclick="appendFunction('sqrt')" class="btn-casio btn-op w-full h-7 rounded text-[11px]">√x</button>
                </div>
                <div>
                    <span class="text-[7px] shift-label block">x³</span>
                    <button onclick="appendFunction('square')" class="btn-casio btn-op w-full h-7 rounded text-[11px]">x²</button>
                </div>
                <div>
                    <span class="text-[7px] shift-label block">ⁿ√</span>
                    <button onclick="appendFunction('pow')" class="btn-casio btn-op w-full h-7 rounded text-[11px]">xⁿ</button>
                </div>

                <!-- Row 2 -->
                <div>
                    <span class="text-[7px] shift-label block">10ⁿ</span>
                    <button onclick="appendFunction('log10')" class="btn-casio btn-op w-full h-7 rounded text-[11px]">log</button>
                </div>
                <div>
                    <span class="text-[7px] shift-label block">eⁿ</span>
                    <button onclick="appendFunction('log')" class="btn-casio btn-op w-full h-7 rounded text-[11px]">ln</button>
                </div>
                <div>
                    <span class="text-[7px] shift-label block">(-)(+)</span>
                    <button onclick="toggleHyp()" class="btn-casio btn-op w-full h-7 rounded text-[9px]">hyp</button>
                </div>
                <div>
                    <span class="text-[7px] shift-label block">sin⁻¹</span>
                    <button onclick="appendTrig('sin')" class="btn-casio btn-op w-full h-7 rounded text-[11px]">sin</button>
                </div>
                <div>
                    <span class="text-[7px] shift-label block">cos⁻¹</span>
                    <button onclick="appendTrig('cos')" class="btn-casio btn-op w-full h-7 rounded text-[11px]">cos</button>
                </div>
                <div>
                    <span class="text-[7px] shift-label block">tan⁻¹</span>
                    <button onclick="appendTrig('tan')" class="btn-casio btn-op w-full h-7 rounded text-[11px]">tan</button>
                </div>

                <!-- Row 3 -->
                <div>
                    <span class="text-[7px] shift-label block">MC</span>
                    <button onclick="appendFunction('abs')" class="btn-casio btn-op w-full h-7 rounded text-[11px]">Abs</button>
                </div>
                <div>
                    <span class="text-[7px] shift-label block">(</span>
                    <button onclick="appendSymbol('(')" class="btn-casio btn-op w-full h-7 rounded text-[11px]">(</button>
                </div>
                <div>
                    <span class="text-[7px] shift-label block">)</span>
                    <button onclick="appendSymbol(')')" class="btn-casio btn-op w-full h-7 rounded text-[11px]">)</button>
                </div>
                <div>
                    <span class="text-[7px] shift-label block">,</span>
                    <button onclick="appendSymbol(',')" class="btn-casio btn-op w-full h-7 rounded text-[11px]">,</button>
                </div>
                <div>
                    <span class="text-[7px] shift-label block">M-</span>
                    <button onclick="memoryAdd()" class="btn-casio btn-op w-full h-7 rounded text-[11px]">M+</button>
                </div>
                <div>
                    <span class="text-[7px] shift-label block">MR</span>
                    <button onclick="memoryRecall()" class="btn-casio btn-op w-full h-7 rounded text-[10px]">RCL</button>
                </div>
            </div>

            <!-- Keypad (Numbers & Primary Math) -->
            <div class="grid grid-cols-5 gap-1.5">
                <!-- Row 1 -->
                <button onclick="appendNumber('7')" class="btn-casio btn-number h-10 rounded-lg text-lg font-bold">7</button>
                <button onclick="appendNumber('8')" class="btn-casio btn-number h-10 rounded-lg text-lg font-bold">8</button>
                <button onclick="appendNumber('9')" class="btn-casio btn-number h-10 rounded-lg text-lg font-bold">9</button>
                <button onclick="deleteLast()" class="btn-casio btn-action-del h-10 rounded-lg text-xs font-bold">DEL</button>
                <button onclick="clearAll()" class="btn-casio btn-action-del h-10 rounded-lg text-xs font-bold">AC</button>

                <!-- Row 2 -->
                <button onclick="appendNumber('4')" class="btn-casio btn-number h-10 rounded-lg text-lg font-bold">4</button>
                <button onclick="appendNumber('5')" class="btn-casio btn-number h-10 rounded-lg text-lg font-bold">5</button>
                <button onclick="appendNumber('6')" class="btn-casio btn-number h-10 rounded-lg text-lg font-bold">6</button>
                <button onclick="appendOp('*')" class="btn-casio btn-op h-10 rounded-lg text-lg font-bold">×</button>
                <button onclick="appendOp('/')" class="btn-casio btn-op h-10 rounded-lg text-lg font-bold">÷</button>

                <!-- Row 3 -->
                <button onclick="appendNumber('1')" class="btn-casio btn-number h-10 rounded-lg text-lg font-bold">1</button>
                <button onclick="appendNumber('2')" class="btn-casio btn-number h-10 rounded-lg text-lg font-bold">2</button>
                <button onclick="appendNumber('3')" class="btn-casio btn-number h-10 rounded-lg text-lg font-bold">3</button>
                <button onclick="appendOp('+')" class="btn-casio btn-op h-10 rounded-lg text-lg font-bold">+</button>
                <button onclick="appendOp('-')" class="btn-casio btn-op h-10 rounded-lg text-lg font-bold">-</button>

                <!-- Row 4 -->
                <button onclick="appendNumber('0')" class="btn-casio btn-number h-10 rounded-lg text-lg font-bold">0</button>
                <button onclick="appendSymbol('.')" class="btn-casio btn-number h-10 rounded-lg text-xl font-bold">.</button>
                <button onclick="appendConstant('pi')" class="btn-casio btn-op h-10 rounded-lg text-xs font-bold">×10ⁿ <span class="text-[8px] block text-amber-400">π</span></button>
                <button onclick="appendAnswer()" class="btn-casio btn-op h-10 rounded-lg text-xs font-bold">Ans</button>
                <button onclick="calculateResult()" class="btn-casio btn-action-green h-10 rounded-lg text-xl font-bold">=</button>
            </div>
        </div>

        <!-- Panels: History & Unit Converter -->
        <div class="lg:col-span-5 flex flex-col gap-3">
            
            <!-- Tabs -->
            <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
                <button id="tab-history-btn" onclick="switchTab('history')" class="flex-1 py-2 text-xs font-bold rounded-lg bg-slate-800 text-emerald-400 transition-all flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-clock-rotate-left"></i> سجل الحسابات
                </button>
                <button id="tab-converter-btn" onclick="switchTab('converter')" class="flex-1 py-2 text-xs font-bold rounded-lg text-gray-400 hover:text-white transition-all flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-scale-balanced"></i> محول الوحدات
                </button>
            </div>

            <!-- Panel 1: History -->
            <div id="panel-history" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 min-h-[320px] max-h-[460px] flex flex-col">
                <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-800">
                    <span class="text-xs font-bold text-gray-300">سجل العمليات السابقة</span>
                    <button onclick="clearHistory()" class="text-[11px] text-red-400 hover:text-red-300 flex items-center gap-1">
                        <i class="fa-solid fa-trash"></i> مسح
                    </button>
                </div>
                <div id="history-list" class="flex-1 overflow-y-auto space-y-2 pr-1">
                    <p class="text-center text-gray-500 text-xs py-8">لا يوجد حسابات مسجلة حتى الآن</p>
                </div>
            </div>

            <!-- Panel 2: Converter -->
            <div id="panel-converter" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 hidden min-h-[320px]">
                <h3 class="text-xs font-bold text-gray-300 mb-3 pb-2 border-b border-slate-800">محول الوحدات الذكي</h3>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-[11px] text-gray-400 mb-1">نوع الوحدة</label>
                        <select id="conv-category" onchange="updateConverterUnits()" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-gray-200 focus:outline-none focus:border-emerald-500">
                            <option value="length">الطول (Length)</option>
                            <option value="mass">الكتلة / الوزن (Mass)</option>
                            <option value="temp">الحرارة (Temperature)</option>
                            <option value="area">المساحة (Area)</option>
                            <option value="volume">الحجم (Volume)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[11px] text-gray-400 mb-1">القيمة المدخلة</label>
                        <input type="number" id="conv-input" value="1" oninput="convertUnits()" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-gray-200 focus:outline-none focus:border-emerald-500 font-mono" placeholder="أدخل الرقم...">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] text-gray-400 mb-1">من</label>
                            <select id="conv-from" onchange="convertUnits()" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-[11px] text-gray-200 focus:outline-none"></select>
                        </div>
                        <div>
                            <label class="block text-[11px] text-gray-400 mb-1">إلى</label>
                            <select id="conv-to" onchange="convertUnits()" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-[11px] text-gray-200 focus:outline-none"></select>
                        </div>
                    </div>

                    <div class="mt-4 p-3 bg-slate-950 rounded-xl border border-slate-800 text-center">
                        <span class="text-[10px] text-gray-400 block mb-0.5">النتيجة المحولة</span>
                        <div id="conv-result" class="text-xl font-bold font-mono text-emerald-400">100 cm</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let expression = '';
        let lastAnswer = '0';
        let memory = 0;
        let isShift = false;
        let isAlpha = false;
        let isHyp = false;
        let angleMode = 'DEG'; // DEG, RAD, GRAD
        let history = [];

        const mainDisplay = document.getElementById('main-display');
        const formulaDisplay = document.getElementById('formula-display');
        const shiftIndicator = document.getElementById('shift-indicator');
        const alphaIndicator = document.getElementById('alpha-indicator');
        const hypIndicator = document.getElementById('hyp-indicator');
        const angleModeDisplay = document.getElementById('angle-mode-display');
        const memoryIndicator = document.getElementById('memory-indicator');

        function updateDisplay() {
            formulaDisplay.innerText = expression || '0';
            shiftIndicator.style.opacity = isShift ? '1' : '0';
            alphaIndicator.style.opacity = isAlpha ? '1' : '0';
            hypIndicator.style.opacity = isHyp ? '1' : '0';
            angleModeDisplay.innerText = angleMode;
            memoryIndicator.style.opacity = memory !== 0 ? '1' : '0';
        }

        function appendNumber(num) {
            expression += num;
            updateDisplay();
        }

        function appendOp(op) {
            if (expression === '' && op !== '-') {
                expression = 'Ans' + op;
            } else {
                expression += op;
            }
            updateDisplay();
        }

        function appendSymbol(sym) {
            expression += sym;
            updateDisplay();
        }

        function appendFunction(func) {
            if (isShift) {
                if (func === 'square') expression += '^3';
                else if (func === 'pow') expression += 'nthRoot(';
                else if (func === 'sqrt') expression += 'cbrt(';
                else if (func === 'log10') expression += '10^(';
                else if (func === 'log') expression += 'e^(';
                else if (func === 'abs') { memory = 0; updateDisplay(); }
                isShift = false;
            } else {
                if (func === 'sqrt') expression += 'sqrt(';
                else if (func === 'square') expression += '^2';
                else if (func === 'pow') expression += '^(';
                else if (func === 'log10') expression += 'log10(';
                else if (func === 'log') expression += 'log(';
                else if (func === 'factorial') expression += '!';
                else if (func === 'abs') expression += 'abs(';
                else if (func === 'frac') expression += '/';
            }
            updateDisplay();
        }

        function appendTrig(trig) {
            if (isShift) {
                if (trig === 'sin') expression += isHyp ? 'asinh(' : 'asin(';
                if (trig === 'cos') expression += isHyp ? 'acosh(' : 'acos(';
                if (trig === 'tan') expression += isHyp ? 'atanh(' : 'atan(';
                isShift = false;
            } else {
                expression += isHyp ? trig + 'h(' : trig + '(';
            }
            isHyp = false;
            updateDisplay();
        }

        function appendConstant(constName) {
            if (constName === 'pi') {
                expression += isShift ? 'e' : 'pi';
                isShift = false;
            }
            updateDisplay();
        }

        function appendAnswer() {
            expression += 'Ans';
            updateDisplay();
        }

        function deleteLast() {
            expression = expression.slice(0, -1);
            updateDisplay();
        }

        function clearAll() {
            expression = '';
            mainDisplay.innerText = '0';
            updateDisplay();
        }

        function resetCalculator() {
            clearAll();
            isShift = false;
            isAlpha = false;
            isHyp = false;
            angleMode = 'DEG';
            updateDisplay();
        }

        function toggleShift() { isShift = !isShift; updateDisplay(); }
        function toggleAlpha() { isAlpha = !isAlpha; updateDisplay(); }
        function toggleHyp() { isHyp = !isHyp; updateDisplay(); }

        function toggleAngleMode() {
            if (angleMode === 'DEG') angleMode = 'RAD';
            else if (angleMode === 'RAD') angleMode = 'GRAD';
            else angleMode = 'DEG';
            updateDisplay();
        }

        function memoryAdd() {
            try {
                let evalResult = evaluateExpression(expression || mainDisplay.innerText);
                memory += parseFloat(evalResult);
                updateDisplay();
            } catch (e) {
                mainDisplay.innerText = 'Error';
            }
        }

        function memoryRecall() {
            expression += memory.toString();
            updateDisplay();
        }

        function calculateResult() {
            if (!expression) return;

            try {
                let parsedExpr = expression.replace(/Ans/g, lastAnswer);
                let result = evaluateExpression(parsedExpr);

                if (typeof result === 'number') {
                    if (!Number.isInteger(result)) {
                        result = parseFloat(result.toFixed(8));
                    }
                }

                mainDisplay.innerText = result;
                addToHistory(expression, result);
                lastAnswer = result.toString();
                expression = '';
            } catch (error) {
                mainDisplay.innerText = 'Syntax ERROR';
            }
        }

        function evaluateExpression(expr) {
            let scope = { Ans: parseFloat(lastAnswer) };

            if (angleMode === 'DEG') {
                expr = expr.replace(/sin\(([^)]+)\)/g, 'sin(($1) * deg)');
                expr = expr.replace(/cos\(([^)]+)\)/g, 'cos(($1) * deg)');
                expr = expr.replace(/tan\(([^)]+)\)/g, 'tan(($1) * deg)');
            } else if (angleMode === 'GRAD') {
                expr = expr.replace(/sin\(([^)]+)\)/g, 'sin(($1) * (pi/200))');
                expr = expr.replace(/cos\(([^)]+)\)/g, 'cos(($1) * (pi/200))');
                expr = expr.replace(/tan\(([^)]+)\)/g, 'tan(($1) * (pi/200))');
            }

            return math.evaluate(expr, scope);
        }

        function addToHistory(req, res) {
            history.unshift({ req, res });
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            if (history.length === 0) {
                list.innerHTML = '<p class="text-center text-gray-500 text-xs py-8">لا يوجد حسابات مسجلة حتى الآن</p>';
                return;
            }

            list.innerHTML = history.map((item, index) => `
                <div onclick="useHistoryItem(${index})" class="p-2 bg-slate-800/60 hover:bg-slate-800 rounded-lg cursor-pointer border border-slate-700/50 transition-all">
                    <div class="text-[11px] text-gray-400 font-mono text-left" dir="ltr">${item.req}</div>
                    <div class="text-sm font-bold text-emerald-400 font-mono text-left" dir="ltr">= ${item.res}</div>
                </div>
            `).join('');
        }

        function useHistoryItem(index) {
            expression = history[index].res.toString();
            updateDisplay();
        }

        function clearHistory() {
            history = [];
            renderHistory();
        }

        function switchTab(tab) {
            const historyPanel = document.getElementById('panel-history');
            const converterPanel = document.getElementById('panel-converter');
            const historyBtn = document.getElementById('tab-history-btn');
            const converterBtn = document.getElementById('tab-converter-btn');

            if (tab === 'history') {
                historyPanel.classList.remove('hidden');
                converterPanel.classList.add('hidden');
                historyBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg bg-slate-800 text-emerald-400 transition-all flex items-center justify-center gap-1.5';
                converterBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-gray-400 hover:text-white transition-all flex items-center justify-center gap-1.5';
            } else {
                historyPanel.classList.add('hidden');
                converterPanel.classList.remove('hidden');
                converterBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg bg-slate-800 text-emerald-400 transition-all flex items-center justify-center gap-1.5';
                historyBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-gray-400 hover:text-white transition-all flex items-center justify-center gap-1.5';
                updateConverterUnits();
            }
        }

        // Unit Converter Logic
        const unitsData = {
            length: {
                m: { name: 'متر (m)', rate: 1 },
                cm: { name: 'سنتيمتر (cm)', rate: 100 },
                km: { name: 'كيلومتر (km)', rate: 0.001 },
                inch: { name: 'بوصة (inch)', rate: 39.3701 },
                foot: { name: 'قدم (foot)', rate: 3.28084 }
            },
            mass: {
                kg: { name: 'كيلوجرام (kg)', rate: 1 },
                g: { name: 'جرام (g)', rate: 1000 },
                lb: { name: 'باوند (lb)', rate: 2.20462 },
                oz: { name: 'أونصة (oz)', rate: 35.274 }
            },
            temp: {
                C: { name: 'سيليزيوس (C°)' },
                F: { name: 'فهرنهايت (F°)' },
                K: { name: 'كلفن (K)' }
            },
            area: {
                m2: { name: 'متر مربع (m²)', rate: 1 },
                km2: { name: 'كيلومتر مربع (km²)', rate: 0.000001 },
                acre: { name: 'فدان / أكر', rate: 0.000247105 }
            },
            volume: {
                l: { name: 'لتر (L)', rate: 1 },
                ml: { name: 'مليلتر (mL)', rate: 1000 },
                m3: { name: 'متر مكعب (m³)', rate: 0.001 },
                gal: { name: 'جالون (gal)', rate: 0.264172 }
            }
        };

        function updateConverterUnits() {
            const cat = document.getElementById('conv-category').value;
            const fromSelect = document.getElementById('conv-from');
            const toSelect = document.getElementById('conv-to');

            const units = Object.keys(unitsData[cat]);
            fromSelect.innerHTML = units.map(u => `<option value="${u}">${unitsData[cat][u].name}</option>`).join('');
            toSelect.innerHTML = units.map(u => `<option value="${u}">${unitsData[cat][u].name}</option>`).join('');

            if (units.length > 1) toSelect.selectedIndex = 1;
            convertUnits();
        }

        function convertUnits() {
            const cat = document.getElementById('conv-category').value;
            const val = parseFloat(document.getElementById('conv-input').value) || 0;
            const from = document.getElementById('conv-from').value;
            const to = document.getElementById('conv-to').value;
            const resultBox = document.getElementById('conv-result');

            let result = 0;
            if (cat === 'temp') {
                result = convertTemperature(val, from, to);
            } else {
                let base = val / unitsData[cat][from].rate;
                result = base * unitsData[cat][to].rate;
            }

            resultBox.innerText = `${result.toFixed(4)} ${to}`;
        }

        function convertTemperature(val, from, to) {
            if (from === to) return val;
            let celsius = val;
            if (from === 'F') celsius = (val - 32) * 5/9;
            if (from === 'K') celsius = val - 273.15;

            if (to === 'F') return (celsius * 9/5) + 32;
            if (to === 'K') return celsius + 273.15;
            return celsius;
        }

        // PWA Installation prompt logic
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('pwa-install-btn');
            if(btn) btn.classList.remove('hidden');
        });

        function installAppPrompt() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('pwa-install-btn').classList.add('hidden');
                    }
                    deferredPrompt = null;
                });
            }
        }

        // Keyboard Event Listeners
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            if (['+', '-', '*', '/'].includes(e.key)) appendOp(e.key);
            if (e.key === 'Enter') calculateResult();
            if (e.key === 'Backspace') deleteLast();
            if (e.key === 'Escape') clearAll();
            if (e.key === '.') appendSymbol('.');
            if (e.key === '(' || e.key === ')') appendSymbol(e.key);
        });

        updateConverterUnits();
    </script>
</body>
</html>
