<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casio fx-991ES PLUS - OMAR MELIGY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Tajawal:wght@400;700&display=swap');
        
        body {
            background-color: #080b11;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        .casio-case {
            background: linear-gradient(145deg, #222630 0%, #0f131a 100%);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 2px 5px rgba(255, 255, 255, 0.15);
            border: 3px solid #090c10;
            border-radius: 2rem;
        }

        .lcd-screen {
            background-color: #9ead86;
            font-family: 'Share Tech Mono', monospace;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.6);
            color: #121e03;
            border: 2px solid #273021;
        }

        .btn-casio {
            transition: all 0.04s ease;
            box-shadow: 0 3px 0 #07090c, 0 4px 6px rgba(0,0,0,0.4);
            font-size: 11px;
        }

        .btn-casio:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #07090c, 0 2px 3px rgba(0,0,0,0.4);
        }

        .btn-shift { background: linear-gradient(135deg, #d97706, #b45309); color: white; }
        .btn-alpha { background: linear-gradient(135deg, #be185d, #9d174d); color: white; }
        .btn-silver { background: linear-gradient(135deg, #cbd5e1, #94a3b8); color: #0f172a; font-weight: bold; }
        .btn-dark { background: linear-gradient(180deg, #334155, #1e293b); color: #f8fafc; border: 1px solid #475569; }
        .btn-num { background: linear-gradient(180deg, #475569, #334155); color: #ffffff; font-weight: bold; }
        .btn-del-ac { background: linear-gradient(180deg, #22c55e, #15803d); color: #ffffff; font-weight: bold; }
        .btn-op { background: linear-gradient(180deg, #334155, #1e293b); color: #f59e0b; font-weight: bold; }
        .btn-equals { background: linear-gradient(180deg, #22c55e, #15803d); color: #ffffff; font-weight: bold; }

        .solar-panel {
            background: linear-gradient(90deg, #2b1203, #451a03, #2b1203);
            border: 1px solid #78350f;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4">

    <!-- Calculator Casio Body -->
    <div class="casio-case p-4 sm:p-5 w-full max-w-sm mx-auto flex flex-col gap-3">
        
        <!-- Top Brand & Solar Section -->
        <div class="flex justify-between items-start px-1">
            <div>
                <h1 class="text-base font-black tracking-widest text-gray-100 leading-none">CASIO</h1>
                <p class="text-[11px] font-bold text-gray-300 font-mono mt-0.5 tracking-tight">fx-991ES <span class="text-amber-500 font-extrabold">PLUS</span></p>
                <p class="text-[8px] text-gray-400 font-mono tracking-wider">NATURAL-V.P.A.M.</p>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-[9px] text-amber-400 font-bold tracking-wider mb-1">Design by OMAR MELIGY</span>
                <div class="solar-panel w-20 h-5 rounded flex gap-0.5 p-0.5 opacity-90 shadow-inner">
                    <div class="w-1/4 h-full border-r border-amber-950/50"></div>
                    <div class="w-1/4 h-full border-r border-amber-950/50"></div>
                    <div class="w-1/4 h-full border-r border-amber-950/50"></div>
                    <div class="w-1/4 h-full"></div>
                </div>
            </div>
        </div>

        <!-- LCD Display Screen -->
        <div class="lcd-screen rounded-md p-2.5 text-left relative overflow-hidden h-24 flex flex-col justify-between">
            <div class="flex justify-between items-center text-[9px] text-stone-900 font-mono tracking-widest font-bold opacity-90">
                <span id="math-mode">Math</span>
                <span id="deg-rad-indicator">D</span>
            </div>
            <div id="expression" class="text-stone-950 text-sm h-6 overflow-x-auto whitespace-nowrap scrollbar-none font-mono"></div>
            <div id="result" class="text-stone-950 text-2xl font-bold font-mono overflow-x-auto whitespace-nowrap leading-none text-right">0</div>
        </div>

        <!-- Shift, Alpha, Mode, ON & D-Pad Row -->
        <div class="grid grid-cols-3 items-center gap-1 px-0.5">
            <div class="flex flex-col gap-1.5">
                <button onclick="pressKey('SHIFT')" class="btn-casio btn-shift py-1 px-2 rounded-full text-[9px] font-bold">SHIFT</button>
                <button onclick="pressKey('ALPHA')" class="btn-casio btn-alpha py-1 px-2 rounded-full text-[9px] font-bold">ALPHA</button>
            </div>

            <!-- Central D-Pad Navigation Button -->
            <div class="flex justify-center items-center my-1">
                <div class="w-16 h-16 rounded-full bg-slate-800 border-2 border-slate-600 shadow-xl flex flex-col justify-between items-center p-1 relative">
                    <button onclick="navigate('up')" class="text-[8px] text-slate-300 hover:text-white absolute top-0.5">▲</button>
                    <div class="flex justify-between w-full px-1 absolute top-5">
                        <button onclick="navigate('left')" class="text-[8px] text-slate-300 hover:text-white">◀</button>
                        <button onclick="navigate('right')" class="text-[8px] text-slate-300 hover:text-white">▶</button>
                    </div>
                    <button onclick="navigate('down')" class="text-[8px] text-slate-300 hover:text-white absolute bottom-0.5">▼</button>
                    <div class="w-5 h-5 rounded-full bg-slate-700 absolute top-5.5 self-center shadow-inner border border-slate-500"></div>
                </div>
            </div>

            <div class="flex flex-col gap-1.5 items-end">
                <button onclick="toggleAngleUnit()" class="btn-casio btn-silver py-1 px-2 rounded-full text-[9px]">MODE</button>
                <button onclick="clearScreen()" class="btn-casio btn-silver py-1 px-2.5 rounded-full text-[9px]">ON</button>
            </div>
        </div>

        <!-- Scientific Functions Grid -->
        <div class="grid grid-cols-5 gap-1 text-[10px] font-mono">
            <button onclick="appendFunction('Math.sin')" class="btn-casio btn-dark py-1.5 rounded">sin</button>
            <button onclick="appendFunction('Math.cos')" class="btn-casio btn-dark py-1.5 rounded">cos</button>
            <button onclick="appendFunction('Math.tan')" class="btn-casio btn-dark py-1.5 rounded">tan</button>
            <button onclick="appendValue('**2')" class="btn-casio btn-dark py-1.5 rounded">x²</button>
            <button onclick="appendValue('**')" class="btn-casio btn-dark py-1.5 rounded">xⁿ</button>

            <button onclick="appendFunction('Math.sqrt')" class="btn-casio btn-dark py-1.5 rounded">√</button>
            <button onclick="appendFunction('Math.log10')" class="btn-casio btn-dark py-1.5 rounded">log</button>
            <button onclick="appendFunction('Math.log')" class="btn-casio btn-dark py-1.5 rounded">ln</button>
            <button onclick="appendValue('(')" class="btn-casio btn-dark py-1.5 rounded">(</button>
            <button onclick="appendValue(')')" class="btn-casio btn-dark py-1.5 rounded">)</button>
        </div>

        <!-- Main Keypad & Operations Grid (Exact Match to Casio Image) -->
        <div class="grid grid-cols-5 gap-1.5 mt-1">
            <button onclick="appendValue('7')" class="btn-casio btn-num py-2.5 rounded text-base">7</button>
            <button onclick="appendValue('8')" class="btn-casio btn-num py-2.5 rounded text-base">8</button>
            <button onclick="appendValue('9')" class="btn-casio btn-num py-2.5 rounded text-base">9</button>
            <button onclick="deleteLast()" class="btn-casio btn-del-ac py-2.5 rounded text-xs">DEL</button>
            <button onclick="clearScreen()" class="btn-casio btn-del-ac py-2.5 rounded text-xs">AC</button>

            <button onclick="appendValue('4')" class="btn-casio btn-num py-2.5 rounded text-base">4</button>
            <button onclick="appendValue('5')" class="btn-casio btn-num py-2.5 rounded text-base">5</button>
            <button onclick="appendValue('6')" class="btn-casio btn-num py-2.5 rounded text-base">6</button>
            <button onclick="appendValue('*')" class="btn-casio btn-op py-2.5 rounded text-lg">×</button>
            <button onclick="appendValue('/')" class="btn-casio btn-op py-2.5 rounded text-lg">÷</button>

            <button onclick="appendValue('1')" class="btn-casio btn-num py-2.5 rounded text-base">1</button>
            <button onclick="appendValue('2')" class="btn-casio btn-num py-2.5 rounded text-base">2</button>
            <button onclick="appendValue('3')" class="btn-casio btn-num py-2.5 rounded text-base">3</button>
            <button onclick="appendValue('+')" class="btn-casio btn-op py-2.5 rounded text-lg">+</button>
            <button onclick="appendValue('-')" class="btn-casio btn-op py-2.5 rounded text-lg">-</button>

            <button onclick="appendValue('0')" class="btn-casio btn-num py-2.5 rounded text-base">0</button>
            <button onclick="appendValue('.')" class="btn-casio btn-num py-2.5 rounded text-base">.</button>
            <button onclick="appendValue('Math.PI')" class="btn-casio btn-dark py-2.5 rounded text-xs font-bold">π</button>
            <button onclick="appendAns()" class="btn-casio btn-dark py-2.5 rounded text-xs font-bold">Ans</button>
            <button onclick="calculate()" class="btn-casio btn-equals py-2.5 rounded text-xl font-black">=</button>
        </div>

    </div>

    <script>
        let expressionEl = document.getElementById('expression');
        let resultEl = document.getElementById('result');
        let lastAns = '0';
        let isDeg = true;
        let isNewCalculation = false;

        function appendValue(val) {
            if (isNewCalculation) {
                expressionEl.innerText = '';
                resultEl.innerText = '0';
                isNewCalculation = false;
            }
            expressionEl.innerText += val;
        }

        function appendFunction(fn) {
            if (isNewCalculation) {
                expressionEl.innerText = '';
                resultEl.innerText = '0';
                isNewCalculation = false;
            }
            expressionEl.innerText += fn + '(';
        }

        function appendAns() {
            if (isNewCalculation) {
                expressionEl.innerText = '';
                resultEl.innerText = '0';
                isNewCalculation = false;
            }
            expressionEl.innerText += lastAns;
        }

        function clearScreen() {
            expressionEl.innerText = '';
            resultEl.innerText = '0';
            isNewCalculation = false;
        }

        function deleteLast() {
            if (isNewCalculation) {
                clearScreen();
                return;
            }
            expressionEl.innerText = expressionEl.innerText.slice(0, -1);
        }

        function toggleAngleUnit() {
            isDeg = !isDeg;
            document.getElementById('deg-rad-indicator').innerText = isDeg ? 'D' : 'R';
        }

        function calculate() {
            try {
                let exp = expressionEl.innerText;
                if (!exp) return;
                
                let evalExp = exp.replace(/×/g, '*').replace(/÷/g, '/');
                let res = eval(evalExp);
                
                if (typeof res === 'number') {
                    res = Number(res.toFixed(8));
                }
                
                resultEl.innerText = res;
                lastAns = res;
                isNewCalculation = true;
            } catch (e) {
                resultEl.innerText = 'Syntax ERROR';
                isNewCalculation = true;
            }
        }

        function pressKey(key) {}
        function navigate(dir) {}
    </script>
</body>
</html>
